<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReqPOOL Estimation Manager</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  </head>
  <body>
    <main class="container">
      <header>
        <h1>ReqPOOL Estimation Manager</h1>
        <p>
          Onlineplattform zur Aufwandsschätzung und Scope-Beschreibung auf Basis
          standardisierter Projektparameter.
        </p>
      </header>

      <section class="card">
        <h2>Projekteingaben</h2>
        <form id="estimation-form">
          <div class="grid">
            <label>Pages <input type="number" name="pages" min="0" value="0" required /></label>
            <label>Use Cases <input type="number" name="useCases" min="0" value="0" required /></label>
            <label>Business Objects <input type="number" name="businessObjects" min="0" value="0" required /></label>
            <label>Interfaces <input type="number" name="interfaces" min="0" value="0" required /></label>
            <label>Batches <input type="number" name="batches" min="0" value="0" required /></label>
            <label>Languages <input type="number" name="languages" min="1" value="1" required /></label>
            <label>Roles <input type="number" name="roles" min="1" value="1" required /></label>
            <label>User <input type="number" name="users" min="1" value="1" required /></label>
          </div>
          <label class="full-width">
            Kurze Projektskizze
            <textarea name="projectSketch" rows="5" placeholder="Beschreibe Ziel, Kontext und wichtige Randbedingungen ..." required></textarea>
          </label>

          <fieldset>
            <legend>Parametrisierung (Personentage pro Einheit)</legend>
            <div class="grid">
              <label>Pages Faktor <input type="number" step="0.1" name="wPages" min="0" value="1.5" required /></label>
              <label>Use Cases Faktor <input type="number" step="0.1" name="wUseCases" min="0" value="2.5" required /></label>
              <label>Business Objects Faktor <input type="number" step="0.1" name="wBusinessObjects" min="0" value="1.8" required /></label>
              <label>Interfaces Faktor <input type="number" step="0.1" name="wInterfaces" min="0" value="3.2" required /></label>
              <label>Batches Faktor <input type="number" step="0.1" name="wBatches" min="0" value="1.2" required /></label>
              <label>Languages Faktor <input type="number" step="0.1" name="wLanguages" min="0" value="0.8" required /></label>
              <label>Roles Faktor <input type="number" step="0.1" name="wRoles" min="0" value="0.7" required /></label>
              <label>User Faktor <input type="number" step="0.01" name="wUsers" min="0" value="0.02" required /></label>
            </div>
          </fieldset>

          <div class="actions">
            <button type="submit">Schätzung berechnen</button>
            <button type="button" id="download-pdf" disabled>PDF erzeugen</button>
          </div>
        </form>
      </section>

      <section class="card" id="result-card" hidden>
        <h2>Ergebnis</h2>
        <div id="estimation-output"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
